name: Feature request
description: A change to a module, or a new module.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        CAT is a toolbox. A developer picks the modules they need, and a module never forces another one on them.
        A good request says what you want to build, not only what API you want.
        For an open idea or a question, use [Discussions](https://github.com/gmarginet/CleanArchitectureToolkit/discussions).
  - type: dropdown
    id: module
    attributes:
      label: Module
      description: The module this is about. Pick "A new module" when nothing fits.
      options:
        - A new module
        - Cat.Api.Client
        - Cat.Api.Gateway
        - Cat.Caching
        - Cat.Commands
        - Cat.Dapper
        - Cat.Db.Errors
        - Cat.Decorators
        - Cat.EFCore
        - Cat.EventAggregators
        - Cat.EventProcessor
        - Cat.Expressions
        - Cat.Extensions
        - Cat.FluentWorkflows
        - Cat.Inbox
        - Cat.IntegrationTesting
        - Cat.Localizations
        - Cat.Messaging
        - Cat.Minimal.Api
        - Cat.Outbox
        - Cat.Queries
        - Cat.Resilience
        - Cat.Responses
        - Cat.Sagas
        - Cat.Scheduling
        - Cat.ServiceRequests
        - Cat.Sql.Cdc
        - Cat.Telemetry
        - Cat.UnitTesting
        - Cat.Users
        - Cat.Validators
        - Template pack (gmarginet.Cat.Templates)
        - Claude plugin (cat)
        - Documentation
        - Other or not sure
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What do you want to build?
      description: The use case behind the request.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What do you do today?
      description: How you solve it now, and what is hard or missing.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea for the solution
      description: Optional. A code sample of how you would like to use it helps.
      render: csharp
