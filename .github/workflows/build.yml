name: Publish CAT nuget packages

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  # A manual run only unlists the next batch of old pre-release packages. It tests and publishes nothing.
  # It lives in this file because the trusted publishing policy on nuget.org is bound to this workflow file.
  workflow_dispatch:
    inputs:
      after:
        description: "Which release the cleanup follows. A stable release also unlists the tagged rc versions."
        type: choice
        options:
          - pre-release
          - stable
        default: pre-release

# Only a tag such as v1.0.0-rc.1 publishes the packages, with the version of the tag, and creates the GitHub release.
# A push to master and a pull request run the tests and publish nothing.
# The skip-ci word in the message of the tagged commit is ignored for a tag.
jobs:
  integration-test:
    name: Run the integration tests
    if: "github.event_name != 'workflow_dispatch' && (startsWith(github.ref, 'refs/tags/v') || !contains(github.event.head_commit.message, 'skip-ci'))"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: codebeltnet/git-checkout@v1

      # The integration tests start SQL Server and PostgreSQL in containers with Testcontainers.
      # The ubuntu-latest runner has Docker. The CI environment variable is set by GitHub, so a missing Docker fails the tests.
      - name: Install .NET
        uses: codebeltnet/install-dotnet@v3

      - name: Run Cake build - IntegrationTest
        uses: cake-build/cake-action@v3
        with:
          cake-version: 7.0.0
          target: IntegrationTest

  release:
    name: Publish CAT nuget packages
    needs: integration-test
    if: "github.event_name != 'workflow_dispatch' && (startsWith(github.ref, 'refs/tags/v') || !contains(github.event.head_commit.message, 'skip-ci'))"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: codebeltnet/git-checkout@v1

      # v3 installs the current LTS and STS SDKs, which are .NET 10 and .NET 11 today. The tests run on both.
      # When a newer LTS or STS comes out, check that .NET 10 and .NET 11 are still installed.
      - name: Install .NET
        uses: codebeltnet/install-dotnet@v3

      # The Test target runs npm test for the payment provider and the web client. Type stripping needs Node.js 22.18 or later.
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install MinVer
        uses: codebeltnet/dotnet-tool-install-minver@v1
        with:
          version: 8.0.0

      - name: Run MinVer
        id: minver
        uses: codebeltnet/minver-calculate@v2
        with:
          options: -t v

      - name: NuGet login (OIDC → temp API key)
        if: "startsWith(github.ref, 'refs/tags/v')"
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Run Cake build - Test
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: cake-build/cake-action@v3
        with:
          cake-version: 7.0.0
          target: Test
          #verbosity: Diagnostic
          arguments: |
            semanticversion: ${{ steps.minver.outputs.version }}

      - name: Run Cake build - Publish
        if: "startsWith(github.ref, 'refs/tags/v')"
        uses: cake-build/cake-action@v3
        env:
            NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        with:
          cake-version: 7.0.0
          target: Publish
          #verbosity: Diagnostic
          arguments: |
            semanticversion: ${{ steps.minver.outputs.version }}

  # The temporary NuGet key lasts one hour, so this job logs in on its own and does not reuse the key of the release job.
  # The trusted publishing policy on nuget.org has all scopes, which includes unlisting.
  # After a tag it runs when the release succeeded. A manual run skips the release, so the condition looks at the event first.
  unlist-old:
    name: Unlist the old pre-release packages on nuget.org
    needs: release
    if: "!cancelled() && (github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success'))"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: codebeltnet/git-checkout@v1

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Every tag unlists the alpha versions and the in-between rc builds. A stable tag, or a manual run with "stable", also unlists the tagged rc versions.
      # After a tag the version of the tag stays listed. A manual run has no tag.
      - name: Unlist the old pre-release versions
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          NUGET_USER: ${{ secrets.NUGET_USER }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          AFTER: ${{ inputs.after }}
        run: |
          $options = @{ Owner = $env:NUGET_USER }
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
              if ($env:AFTER -eq 'stable') { $options.IncludeTaggedRc = $true }
          }
          else {
              $version = $env:REF_NAME.TrimStart('v')
              $options.Keep = $version
              if ($version -notmatch '-') { $options.IncludeTaggedRc = $true }
          }
          ./.github/scripts/Unlist-OldPrereleases.ps1 @options

  github-release:
    name: Create the GitHub release
    needs: release
    if: "startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The notes come from the commit subjects since the previous tag, so the checkout needs the full history.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A version with a dash, such as 1.0.0-rc.1, is a pre-release. The first tag has no previous tag, so it gets no list of changes.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          intro="$(cat .github/release-intro.md)"
          notes="${intro//\{version\}/$version}"

          previous="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            changes="$(git log --no-merges --pretty='format:- %s' "${previous}..${TAG}")"
            changes="${changes// (skip-pub)/}"
            notes="${notes}"$'\n\n'"## Changes"$'\n\n'"${changes}"$'\n\n'"**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${TAG}"
          fi

          flags=""
          if [[ "$version" == *-* ]]; then flags="--prerelease"; fi

          gh release create "$TAG" --title "$TAG" --notes "$notes" --verify-tag $flags
