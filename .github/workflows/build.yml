name: Publish CAT nuget packages

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

# A tag such as v1.0.0-rc.1 publishes the packages with the version of the tag and creates the GitHub release.
# The skip-ci and skip-pub words in the message of the tagged commit are ignored for a tag.
jobs:
  integration-test:
    name: Run the integration tests
    if: "startsWith(github.ref, 'refs/tags/v') || !contains(github.event.head_commit.message, 'skip-ci')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: codebeltnet/git-checkout@v1

      # The integration tests start SQL Server and PostgreSQL in containers with Testcontainers.
      # The ubuntu-latest runner has Docker. The CI environment variable is set by GitHub, so a missing Docker fails the tests.
      - name: Install .NET
        uses: codebeltnet/install-dotnet@v3

      - name: Run Cake build - IntegrationTest
        uses: cake-build/cake-action@v3
        with:
          cake-version: 7.0.0
          target: IntegrationTest

  release:
    name: Publish CAT nuget packages
    needs: integration-test
    if: "startsWith(github.ref, 'refs/tags/v') || !contains(github.event.head_commit.message, 'skip-ci')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: codebeltnet/git-checkout@v1

      # v3 installs the current LTS and STS SDKs, which are .NET 10 and .NET 11 today. The tests run on both.
      # When a newer LTS or STS comes out, check that .NET 10 and .NET 11 are still installed.
      - name: Install .NET
        uses: codebeltnet/install-dotnet@v3

      # The Test target runs npm test for the payment provider and the web client. Type stripping needs Node.js 22.18 or later.
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install MinVer
        uses: codebeltnet/dotnet-tool-install-minver@v1
        with:
          version: 8.0.0

      - name: Run MinVer
        id: minver
        uses: codebeltnet/minver-calculate@v2
        with:
          options: -t v

      - name: NuGet login (OIDC → temp API key)
        if: "github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || !contains(github.event.head_commit.message, 'skip-pub'))"
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Run Cake build - Test
        if: "github.event_name == 'pull_request' || (!startsWith(github.ref, 'refs/tags/v') && contains(github.event.head_commit.message, 'skip-pub'))"
        uses: cake-build/cake-action@v3
        with:
          cake-version: 7.0.0
          target: Test
          #verbosity: Diagnostic
          arguments: |
            semanticversion: ${{ steps.minver.outputs.version }}

      - name: Run Cake build - Publish
        if: "github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || !contains(github.event.head_commit.message, 'skip-pub'))"
        uses: cake-build/cake-action@v3
        env:
            NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        with:
          cake-version: 7.0.0
          target: Publish
          #verbosity: Diagnostic
          arguments: |
            semanticversion: ${{ steps.minver.outputs.version }}

  # The temporary NuGet key lasts one hour, so this job logs in on its own and does not reuse the key of the release job.
  # The trusted publishing policy on nuget.org has all scopes, which includes unlisting.
  unlist-alpha:
    name: Unlist the alpha packages on nuget.org
    needs: release
    if: "startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: codebeltnet/git-checkout@v1

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Unlist the alpha versions
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: ./.github/scripts/Unlist-AlphaPackages.ps1 -Owner $env:NUGET_USER

  github-release:
    name: Create the GitHub release
    needs: release
    if: "startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The notes come from the commit subjects since the previous tag, so the checkout needs the full history.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A version with a dash, such as 1.0.0-rc.1, is a pre-release. The first tag has no previous tag, so it gets no list of changes.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          intro="$(cat .github/release-intro.md)"
          notes="${intro//\{version\}/$version}"

          previous="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            changes="$(git log --no-merges --pretty='format:- %s' "${previous}..${TAG}")"
            changes="${changes// (skip-pub)/}"
            notes="${notes}"$'\n\n'"## Changes"$'\n\n'"${changes}"$'\n\n'"**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${TAG}"
          fi

          flags=""
          if [[ "$version" == *-* ]]; then flags="--prerelease"; fi

          gh release create "$TAG" --title "$TAG" --notes "$notes" --verify-tag $flags
