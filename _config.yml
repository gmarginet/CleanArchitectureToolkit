remote_theme: pages-themes/hacker@v0.2.0
title: Clean Architecture Toolkit for .NET
description: Clean Architecture Toolkit is a clean, modular architecture foundation for .NET applications. It embraces SOLID principles and focuses on maintainability, testability, and scalability through clear boundaries and pluggable design.
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-default-layout
  - jekyll-github-metadata
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-seo-tag
  - jekyll-titles-from-headings
relative_links:
  enabled: true
  collections: true
exclude:
  - README_NUGET.md
  - Gemfile
  - Gemfile.lock
  - vendor
