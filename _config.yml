theme: cat-theme
github_url: https://github.com/gmarginet/CleanArchitectureToolkit
# The address that gets the page views. The theme counts page views and shows a privacy line in the footer only when this is set.
# It is the own proxy of the owner, which passes the count on to GoatCounter, so blockers do not stop it.
# To send to GoatCounter directly, set goatcounter to the site code instead, such as cat-toolkit.
goatcounter_endpoint: https://s.marginet.be/h/cat
title: Clean Architecture Toolkit for .NET
description: Clean Architecture Toolkit is a clean, modular architecture foundation for .NET applications. It embraces SOLID principles and focuses on maintainability, testability, and scalability through clear boundaries and pluggable design.
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-relative-links
  - jekyll-default-layout
  - jekyll-github-metadata
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-seo-tag
  - jekyll-titles-from-headings
relative_links:
  enabled: true
  collections: true
exclude:
  - README_NUGET.md
  - claudeskills/skills
  - claudeskills/evals
  - Gemfile
  - Gemfile.lock
  - jekyll-theme
  - vendor
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /resources/logo/CatLogo-og.png
        width: 1200
        height: 627
        alt: Clean Architecture Toolkit for .NET logo
