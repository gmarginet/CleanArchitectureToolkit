<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/cat-theme.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>
  <body>
    {% assign github_url = site.github.repository_url | default: site.github_url %}
    {% if github_url %}
    <div class="topbar">
      <a class="github-button" href="{{ github_url }}">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        View on GitHub
      </a>
    </div>
    {% endif %}
    <main class="content">
      {{ content }}
    </main>
    <script>
      var saveIcon = '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2.5 1h9.2L15 4.3v9.2a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 1 13.5v-11A1.5 1.5 0 0 1 2.5 1zM2 2.5v11a.5.5 0 0 0 .5.5H3V9.5A1.5 1.5 0 0 1 4.5 8h7A1.5 1.5 0 0 1 13 9.5V14h.5a.5.5 0 0 0 .5-.5V4.7L11.3 2H11v2.5A1.5 1.5 0 0 1 9.5 6h-4A1.5 1.5 0 0 1 4 4.5V2h-1.5a.5.5 0 0 0-.5.5zM12 14V9.5a.5.5 0 0 0-.5-.5h-7a.5.5 0 0 0-.5.5V14h8zM5 2v2.5a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5V2H5z"/></svg>';
      var checkIcon = '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M13.65 3.65a.5.5 0 0 1 0 .7l-7 7a.5.5 0 0 1-.7 0l-3.5-3.5a.5.5 0 1 1 .7-.7L6.3 10.3l6.65-6.65a.5.5 0 0 1 .7 0z"/></svg>';
      document.querySelectorAll('pre').forEach(function (pre) {
        var wrapper = document.createElement('div');
        wrapper.className = 'code-block';
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);

        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'copy-button';
        button.title = 'Copy code';
        button.setAttribute('aria-label', 'Copy code');
        button.innerHTML = saveIcon;
        button.addEventListener('click', function () {
          navigator.clipboard.writeText(pre.innerText).then(function () {
            button.innerHTML = checkIcon;
            button.classList.add('copied');
            setTimeout(function () {
              button.innerHTML = saveIcon;
              button.classList.remove('copied');
            }, 1500);
          });
        });
        wrapper.appendChild(button);
      });
    </script>
  </body>
</html>
